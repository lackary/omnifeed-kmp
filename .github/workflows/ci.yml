name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - '.releaserc.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/deploy-web.yml'
      - 'run_act_safe.sh'
      - 'site/**'
      - 'doc'
      - 'renovate.json'

  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - '.releaserc.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/deploy-web.yml'
      - 'run_act_safe.sh'
      - 'site/**'
      - 'doc'
      - 'renovate.json'

  workflow_dispatch:
    inputs:
      enable_kotlin_daemon:
        description: 'Enable Kotlin/Native Daemon for build'
        type: boolean
        required: false
        default: false
      run_with_stacktrace:
        description: 'Run Gradle with --stacktrace'
        type: boolean
        required: false
        default: false
      run_with_info:
        description: 'Run Gradle with --info'
        type: boolean
        required: false
        default: false
      run_with_debug:
        description: 'Run Gradle with --debug'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test
    runs-on: macos-26
    env:
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
      GOOGLE_SERVICES_WEB_CLIENT_ID: ${{ secrets.GOOGLE_SERVICES_WEB_CLIENT_ID }}
      # Firebase and Google Auth secrets for BuildKonfig and dynamic file generation
      FIREBASE_WEB_BASE64: ${{ secrets.FIREBASE_WEB_BASE64 }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
    permissions:
      contents: read
      checks: write # For mikepenz/action-junit-report
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Firebase Secrets (Android & iOS)
        run: |
          echo "Decoding Firebase Android configuration..."
          # Recreate google-services.json for the Android sample app
          echo "${{ secrets.FIREBASE_ANDROID_BASE64 }}" | base64 --decode > sampleApp/androidApp/google-services.json
          
          # Patch google-services.json if it doesn't contain the .dev package name used for debug builds
          PACKAGE_NAME="io.lackstudio.omnifeed.app"
          DEBUG_PACKAGE_NAME="${PACKAGE_NAME}.dev"
          if ! grep -q "$DEBUG_PACKAGE_NAME" sampleApp/androidApp/google-services.json; then
            echo "Patching google-services.json to include ${DEBUG_PACKAGE_NAME}..."
            # Use a robust way to add the debug client config if only production exists
            if command -v jq &> /dev/null; then
              jq --arg prod "$PACKAGE_NAME" --arg dev "$DEBUG_PACKAGE_NAME" \
                '.client += [.client[] | select(.client_info.android_client_info.package_name == $prod) | .client_info.android_client_info.package_name = $dev]' \
                sampleApp/androidApp/google-services.json > sampleApp/androidApp/google-services.json.tmp && \
                mv sampleApp/androidApp/google-services.json.tmp sampleApp/androidApp/google-services.json
            else
              # Fallback to simple sed if jq is not available
              sed -i '' "s/\"package_name\": \"$PACKAGE_NAME\"/\"package_name\": \"$DEBUG_PACKAGE_NAME\"/g" sampleApp/androidApp/google-services.json
            fi
          fi

          echo "Decoding Firebase iOS configuration..."
          # Ensure the directory exists and recreate GoogleService-Info.plist for the iOS sample app
          mkdir -p sampleApp/iosApp/iosApp
          echo "${{ secrets.FIREBASE_IOS_BASE64 }}" | base64 --decode > sampleApp/iosApp/iosApp/GoogleService-Info.plist

      - name: Create Dynamic Secrets XConfig File
        working-directory: './sampleApp/iosApp/Configuration'
        run: |
          XCONFIG_DEBUG_FILENAME="Secrets-Debug.xconfig"
          XCONFIG_RELEASE_FILENAME="Secrets-Release.xconfig"

          echo "Creating ${XCONFIG_DEBUG_FILENAME} in CI..."
          echo "Creating ${XCONFIG_RELEASE_FILENAME} in CI..."
          
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > "${XCONFIG_DEBUG_FILENAME}"
          echo "REVERSED_CLIENT_ID=${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}" >> "${XCONFIG_DEBUG_FILENAME}"
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > "${XCONFIG_RELEASE_FILENAME}"
          echo "REVERSED_CLIENT_ID=${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}" >> "${XCONFIG_RELEASE_FILENAME}"

      - name: Setup iOS Environment (Dummy Framework & Pods)
        run: |
          if [ -n "$ACT" ]; then
            echo "Running in 'act' environment."
            if ! command -v pod &> /dev/null; then
              echo "CocoaPods not found. Installing via Homebrew..."
              brew install cocoapods
            else
              echo "CocoaPods is already installed."
            fi
          else
            echo "Running in CI environment. Installing CocoaPods..."
            gem install cocoapods
          fi

          echo "Running Setup Script..."
          chmod +x setup_ios.sh
          ./setup_ios.sh

      # List simulators
      - name: List available simulators
        run: |
          echo "=== RUNTIMES ==="
          xcrun simctl list runtimes
          echo "=== DEVICES ==="
          xcrun simctl list devices

      # Automatically find an available simulator
      - name: Select an available simulator
        id: find-sim
        run: |
          set -e
          SIM=$(xcrun simctl list devices | \
            grep -E "iPhone" | \
            grep -v unavailable | \
            grep -v "(Booted)" | \
            sed -nE 's/.*\(([0-9A-F-]{36})\).*/\1/p' | \
            head -n 1)

          if [ -z "$SIM" ]; then
            echo "❌ No available iPhone simulators found"
            exit 1
          fi
          echo "✅ Selected Simulator UUID: $SIM"
          echo "SIM=$SIM" >> $GITHUB_ENV

      - name: Xcode Build (clean build .xcworkspace)
        working-directory: './sampleApp/iosApp'
        run: |
          echo "Building iOS target via .xcworkspace..."
          xcodebuild clean build \
              -workspace "iosApp.xcworkspace" \
              -scheme "iosApp" \
              -configuration "Debug" \
              -sdk iphonesimulator \
              -destination "id=$SIM" \
              ENABLE_PREVIEWS=NO

      - name: Gradle Build to Generate KMP Framework
        run: |
          ./gradlew assembleDebug \
              ${{ inputs.run_with_stacktrace && '--stacktrace' || '' }} \
              ${{ inputs.run_with_info && '--info' || '' }} \
              ${{ inputs.run_with_debug && '--debug' || '' }} \
              ${{ inputs.enable_kotlin_daemon && '-Pkotlin.native.enableDaemon=true' || '' }}

      - name: Run KMP Unit Tests
        run: |
          ./gradlew check \
              -Pskip.tests=false \
              -Pskip.native.tests=false \
              -Pskip.lint=true \
              ${{ inputs.run_with_stacktrace && '--stacktrace' || '' }} \
              ${{ inputs.run_with_info && '--info' || '' }} \
              ${{ inputs.run_with_debug && '--debug' || '' }} \
              ${{ inputs.enable_kotlin_daemon && '-Pkotlin.native.enableDaemon=true' || '' }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          check_name: 'JUnit Test Report'
          detailed_summary: true
          include_passed: true
          annotate_only: ${{ env.ACT == 'true' }}

      - name: Upload Test Report HTML
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-html
          path: '**/build/reports/tests/'
          retention-days: 5
